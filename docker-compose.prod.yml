# Full production stack. Run with:
#   docker compose -f docker-compose.prod.yml up --build
# Then visit http://localhost:5173
#
# Dev/local hot-reload still uses docker-compose.yml (postgres + redis
# only) plus your normal `uv run uvicorn` and `npm run dev` outside.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meinrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meinrag}
      POSTGRES_DB: ${POSTGRES_DB:-meinrag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meinrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the in-network postgres service.
      # .env can leave it pointed at localhost for outside-Docker dev.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-meinrag}:${POSTGRES_PASSWORD:-meinrag}@postgres:5432/${POSTGRES_DB:-meinrag}
    volumes:
      - app_data:/app/data
      - docling_cache:/root/.cache/docling
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "${HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  app_data:
  docling_cache:
