server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF uploads
    client_max_body_size 100M;

    # SPA static + history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — match every backend root path
    location ~ ^/(health|users|documents|graph|query|sessions|stats)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through X-User-Id and any other custom headers
        proxy_pass_request_headers on;

        # SSE / streaming friendliness — /query/stream and /query/ask-ai/stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
