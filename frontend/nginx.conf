server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Allow PDF uploads
    client_max_body_size 100M;

    # SPA static + history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoints — long timeouts, no buffering. Must come before the
    # generic API proxy block so this location wins by longest prefix.
    location ~ ^/query/(stream|ask-ai/stream)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # API proxy — match every backend root path
    location ~ ^/(health|users|documents|graph|query|sessions)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
