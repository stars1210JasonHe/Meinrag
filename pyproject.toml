[project]
name = "meinrag"
version = "0.1.0"
description = "RAG backend with FastAPI and LangChain"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Configuration
    "pydantic-settings>=2.5.0",
    # LangChain core
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # LLM providers
    "langchain-openai>=0.3.0",
    # Vector stores
    "langchain-chroma>=1.0.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    # Document loaders
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.13.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
    # Web search fallback
    "duckduckgo-search>=7.0",
    # Streaming
    "sse-starlette>=2.0.0",
    # Re-ranking
    "flashrank>=0.2",
    "arq>=0.27.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.80.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
anonymization = [
    # PII de-identification — install only when ANONYMIZATION_ENABLED=true.
    # See docs in README "Enabling Anonymization (Optional)".
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7",
    # Required by zh_core_web_trf — registers the `curated_transformer`
    # pipeline factory the Chinese transformer model uses.
    "spacy-curated-transformers>=0.2,<1.0",
    # typer is a spaCy 3.7+ transitive dep that uv doesn't auto-pull
    # via spacy's metadata on Python 3.13; pin it explicitly so the
    # extra installs cleanly.
    "typer>=0.21.1",
    "langdetect>=1.0.9",
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.5",
    "playwright>=1.58.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
