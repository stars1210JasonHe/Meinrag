name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: Offline pytest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        # --extra anonymization is required, not optional-for-completeness: 17 test
        # files import app.anonymization.*, which pulls cryptography (directly) and
        # presidio/spacy (via app.anonymization.engine). Without it every one of them
        # raises at COLLECTION time, and pytest aborts the whole run — so the other
        # 735 tests never execute and the red check says nothing about the change
        # being tested. Red since at least 2026-06-13 for exactly this reason.
        run: uv sync --group dev --extra anonymization

      - name: Run offline tests
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_frontend_e2e.py \
            --ignore=tests/test_api_workflow.py \
            -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
