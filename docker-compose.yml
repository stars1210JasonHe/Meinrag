# Dev helpers — only the services you'd otherwise install locally.
# Backend + frontend run on your host (uvicorn + npm run dev) for
# hot-reload during development.
#
# For the full prod stack, use docker-compose.prod.yml instead.
#
# Note: Redis is only required when TASK_BACKEND=arq. The default
# TASK_BACKEND=background uses FastAPI's in-process queue, so this
# dev compose intentionally omits Redis. Add a redis service back if
# you switch to arq.

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      # Dev-only credentials — DO NOT use this compose file for production.
      # The prod stack (docker-compose.prod.yml) reads POSTGRES_PASSWORD
      # from .env so you can set a strong one there.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meinrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
