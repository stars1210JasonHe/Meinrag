services:
  # PostgreSQL — only needed when DATABASE_URL uses postgresql+asyncpg://
  # Start with: docker compose up postgres -d
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meinrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — needed when TASK_BACKEND=arq
  # Start with: docker compose up redis -d
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # App — works with both SQLite (default) and PostgreSQL
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - app_data:/app/data

volumes:
  pgdata:
  redis_data:
  app_data:
